<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生誕ライブ</title>

    <meta property="og:title" content="てん生誕ライブ特設サイト">
    <meta property="og:description" content="生誕ライブのカンパ募集・メッセージカード受付中！">
    <meta property="og:image" content="https://akki052300.github.io/images/ogpv2.jpg?v=3">
    <meta property="og:url" content="https://akki052300.github.io/">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://akki052300.github.io/images/ogpv2.jpg?v=3">


    <!-- CSS -->
    <link rel="stylesheet" href="css/site.css" />
</head>

<body>

    <div class="container">

        <div class="idol-wrapper fade-up">
            <img src="images/ten.png" class="idol-photo" alt="idol">
            <img src="images/title.png" class="title-logo" alt="title">
        </div>

        <div class="info-card first-card">
            <h2>実質チケット半額⁉<br>🎁チケット配布キャンペーン</h2>
            <p>
                1口1000円～のカンパをしていただくと<br>
                ご希望の方"全員"に<br>
                生誕ライブのチケットをプレゼントいたします。<br>
            </p>

            <a href="https://passmarket.yahoo.co.jp/event/show/detail/02aq11phrqw41.html"
               class="image-button" target="_blank" rel="noopener noreferrer">
                <img src="images/kanpaButton.png" alt="カンパ募集">
            </a>
        </div>

        <div class="info-card">
            <h2>💌 メッセージカード募集中</h2>
            <p>
                お祝いメッセージをてんさんへお届けします。<br>
                あなたの想いをぜひ送ってください。<br>
            </p>

            <a href="https://forms.gle/zb33x3tH575ubffk9"
               class="image-button" target="_blank" rel="noopener noreferrer">
                <img src="images/messageButton.png" alt="メッセージカード">
            </a>
        </div>

        <a href="game.html" class="image-button game-btn">
            <img src="images/game.png" alt="ミニゲームへ">
        </a>


        <div class="share-area">
            <a id="shareX" href="#" target="_blank" rel="noopener noreferrer" class="image-button share-btn">
                <img src="images/share.png" alt="Xでシェア">
            </a>

            <a id="bgmToggle" class="image-button bgm-btn" href="javascript:void(0)">
                <img id="bgmIcon" src="images/bgm_start.png" alt="BGM切替">
            </a>
        </div>

        <audio id="bgm" src="audio/bgm.mp3" loop></audio>
    </div>

    <div id="bgmModal" class="modal-backdrop">
        <div class="modal">
            <p>
            こちらは運営の許可のもとで制作された<br>
            非公式のファインサイトです<br>
            このページではBGMが再生されます。</p>

            <div class="modal-buttons">
                <a href="javascript:void(0)" id="bgmStart" class="modal-image-btn ok-btn">
                    <img src="images/bgm_on.png" alt="OK（再生）">
                </a>

                <a href="javascript:void(0)" id="bgmOff" class="modal-image-btn off-btn">
                    <img src="images/bgm_off.png" alt="再生しない">
                </a>
            </div>
        </div>
    </div>

    <!-- JS（bodyの最後に置くのが安定） -->
    <script src="js/site.js"></script>
</body>
</html>
